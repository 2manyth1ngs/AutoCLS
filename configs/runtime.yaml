# =====================================================================
# 云上跑批的运行期配置——**worker 分档 / 显存预算 / 线程数的唯一真源**
# 依据 docs/GATE_5090_REPORT.md §3（1×RTX 5090 实测标定）。
#
# 与 configs/train.yaml 的分工：train.yaml 管"训练量口径"（iters/batch_size，铁律 2，
# 改了会改变实验结论）；本文件只管"怎么把同样的活儿排到卡上"，改了不影响任何 R' 数值。
#
# 阶段1 的并行粒度是**数据集**（一个数据集一个进程，各自 --resume）：
# - 跨数据集共享 rprime_cache.jsonl / noise_cache.jsonl（行追加，单行 ≤706 B <
#   4096 B 的 POSIX 原子追加边界，并发安全）；
# - 每进程一份 inflight.txt（否则看门狗毒条目归因错乱）与一份 tasks_meta.d/<ds>.json。
# =====================================================================

gpu:
  vram_gib: 31.4          # RTX 5090 实测可用显存
  budget_gib: 24.0        # 准入预算：留 7.4 GiB 头寸给"两点外推的峰值模型估不准"
  # 单进程显存峰值模型 peak(L) = base + per_len × L，锚在两个实测点上：
  #   §3.2 NATOPS L=51 8 worker 共 10.9 GB → 1.36 GiB/进程
  #   §3.3 合成 SCP2 L=1152 单进程峰值 15.8 GB（爆点是 _masked_triplet 的 (P,n) hinge）
  # 峰值主要由 L 与 batch_size 决定（(n,n) 里的 n 是编码后时间步数），与样本数关系不大。
  #
  # ⚠️ 该模型按 **L** 取值，但真实峰值取决于**编码后长度 n=2T**，而 T 被 CLS 的
  # resize 放大到 2L（p 是高斯 σ，T_new=round(T·(1+ε))，上限 2T）——sim 是 (B,n,n)，
  # 按 T² 走。docs/TRIPLET_OOM_FIX.md §5 实测：SCP2 L=1152 最坏一次 resize 下
  # n=4378、峰值 29.2 GiB，是本模型给出的 15.8 的 1.85 倍。故本模型只适合**排程
  # 估算**，不构成安全保证；真正兜底的是 autocls/oom_guard.py（OOM 不写缓存 +
  # worker=1 串行收尾重试）。重标定需要 5090 上按最坏 resize 抽样，尚未做。
  peak_gib_base: 0.694
  peak_gib_per_len: 0.013113

throughput:
  # 单 worker 秒/条（early_iters=290）模型，同样锚两点：
  #   §3.1 NATOPS L=51 OMP=1 实测 12.6 s/条
  #   §3.3 合成 SCP2 L=1152 单 worker 123.6 s/条
  seconds_base: 7.458
  seconds_per_len: 0.100818
  # 并发折损系数（ETA 用，不影响调度）。§3.2 实测 2 并发 2.19×、4 并发 3.96×（近线性），
  # 8 并发才降到 5.24×；数据集级并行下典型并发 2–4，取 1.10 作保守余量。
  contention_factor: 1.10

workers:
  max_concurrent: 8       # 全局进程上限（§3.2：8 worker GPU 91%，再多收益递减）
  # 每档"同时最多几个"。§3.3 实测表：
  #   L ≤ ~200  → 8（NATOPS/ERing/ArticularyWord/Handwriting/CharacterTrajectories）
  #   L ~300–600 → 2（UWave 315 / HandMovement 400 / Heartbeat 405 / MotorImagery 512）
  #                  ⚠️ 保守值，**未实测**——风险由 autocls/oom_guard.py 兜住
  #   L ≥ ~600  → 1（SCP1 896 / Ethanol 1024 / SCP2 1152；实测 2 个 SCP2 必 OOM）
  # 分档是上限，跨档回填另受 gpu.budget_gib 约束（长序列独占整卡是纯浪费：
  # 单 worker GPU 利用率仅 5.7%，本负载 CPU-bound）。
  tiers:
    - {max_l_enc: 200,  workers: 8}
    - {max_l_enc: 600,  workers: 2}
    - {max_l_enc: null, workers: 1}

# 每个 worker 进程必带的环境。**不依赖手动 export**：cloud_run.sh 与
# scripts/run_stage1.py 都从这里读并注入（autocls/cloud_plan.py: worker_env）。
#
# 线程数：§3.1 实测 54 核容器里 torch 默认 192 线程，对 128×51×24 这种小张量
# OpenMP 同步开销压倒计算 → 53 s/条（0.63×，比 4060 笔记本还慢）；置 1 后
# 12.6 s/条（2.67×）。
#
# AUTOCLS_TRIPLET_CHUNK_ELEMS：triplet hinge 的分块阈值（元素数），
# autocls/contrastive/losses.py 的默认值来源。**纯内存旋钮，不改任何 R' 数值**
# （分块求和 = 整体求和，等价性见 tests/test_triplet_chunking.py）。2^26 = 268 MiB/张量。
# 调小更省显存、Python 侧分块循环变多；调大反之。
#
# AUTOCLS_INFONCE_CHUNK_ELEMS：InfoNCE 相似度矩阵的分块阈值（sim 的元素数 B·n·n），
# 同一个文件同一条注入链。MX-3-PQ 12 条 OOM 跳过的轨迹里 10 条是 info_nce+temporal
# （Ethanol L=1024 / SCP2 L=1152，resize 后 n=2T≈2048~2304 → sim 单张 2.7 GB，
# 而不分块路径还要再物化 ~4.5 份同形张量）。**纯内存旋钮**：InfoNCE 的 log_softmax
# 只在每个实例自己的 (n, n) 上取，前导维之间独立，分块 = 整体（等价性见
# tests/test_infonce_chunking.py）。阈值以下走原路径、逐位不变，已缓存的 R' 照样复现。
# 2^26 在 B=128/n=2304 上 → 每块 12 个实例、共 11 块。**注意**：阈值按元素数判，
# instance 对比的 (T, 2B, 2B) 在 T>1024 时也会走分块（同样精确，只是多一条与旧缓存
# 的结合序差异）；想把新路径只留给 temporal，把本项调到 2^28 以上即可。
#
# 这两个阈值同时还是"**要不要物化相似度矩阵**"的判据（Round 2，2026-09-03）：
# pair_construction 的 temporal 与 cross-scale 在越阈值时改从**表征**逐块算损失，
# (B, m, n) 的 sim 与它的梯度缓冲全程不存在（losses.masked_info_nce_from_reprs /
# masked_triplet_from_reprs）。于是损失步的峰值变成
#     ≈ 7 × (分块预算的字节数) + O(B·n·C)
# —— **不再含 n² 项**，resize 把 n 推到 2T 也不会把峰值推上去。2^26 对应块工作集
# ~1.7 GiB；长序列端若还要余量，把这两项一起调到 2^24（~0.4 GiB）即可，纯内存旋钮。
#
# PYTORCH_CUDA_ALLOC_CONF：阶段1 那 69 条 OOM 的报错里有 "7.58 GiB is reserved by
# PyTorch but unallocated"——每 iteration 的张量尺寸随 resize 随机浮动（SCP2 的
# n=2T 在 1152~4378 间跳），缓存分配器的分段极易碎片化。expandable_segments 让
# 分段可增长，把这部分要回来；补跑那几条 29 GiB 级的条目就靠这点余量。
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  AUTOCLS_TRIPLET_CHUNK_ELEMS: "67108864"
  AUTOCLS_INFONCE_CHUNK_ELEMS: "67108864"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
