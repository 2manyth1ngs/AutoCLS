# =====================================================================
# WP17-ACTS（严格复现 AutoCTS++）的唯一真源——scripts/acts_common.py 读。
# 协议 results/acts/s1/PROTOCOL.md（S1）；方案 docs/AUTOCTS_STRICT_REPRO_PLAN.md。
# 约定：
# - 档位与合法性仍只来自 configs/space.yaml（铁律 1）；本文件只 **追加** 约束（normalize）
#   与剪枝谓词（prune），且只在 acts_common.acts_space() 生效——默认 CLSSpace 逐位不变。
# - 训练量口径只来自 configs/train.yaml protocols（铁律 2）；这里只记协议名。
# - S1 锁定后 pilot / slicing / candidates / labels / prune / normalize 只增不改；S2 只改 full。
# =====================================================================
protocol: ts2vec_official          # configs/train.yaml: protocols 键（batch 8、iters 200/600、截点 25/50/100%）

# --- 规范化第二条约束（PROTOCOL §1.3）：kernel = 0 → 单尺度，pool / cross_scale 失活 ---
# cross_scale 无效档取 false（不是 null）：temporal=false 时第一条约束接着触发，
# 落到与旧空间"只有 instance"逐位相同的规范形，不产生第二种写法。
normalize:
  constraints:
    - when_equals: {kernel: 0}
      gated_fields: [pool, cross_scale]
      inactive_values: {pool: null, cross_scale: false}

# --- 结构性剪枝（PROTOCOL §1.2；方案 §3.6-2）：三语料一致的两条，其余不剪 ---
prune:
  rules:
    - {name: tau100,        all: [{field: temperature, equals: 100.0}]}
    - {name: infonce_tau10, all: [{field: loss_type, equals: info_nce}, {field: temperature, equals: 10.0}]}
  champion_retention_min: 0.90      # G-A0：官方口径 29 靶冠军在剪后空间的保留率

# --- 任务划分（PROTOCOL §1.1 / §1.9；AutoCTS++ dataset_slice.py 的两维 + 分类特有的实例内时间窗 = 三轴四档） ---
# 映射更正（用户 2026-09-19）：AutoCTS++ 的 T 轴语义是训练样本量 → 对应本方案的样本数 n（对数四档、按类分层抽样）；
# 实例内时间窗 L 是分类特有的附加轴；三轴用 OA(16, 4^3) 采样，每集仍 16 个子集、标签预算不变。
slicing:
  seed: 0
  tiers: 4                          # 25/50/75/100% 四档（前三档右开、末档闭）
  channel_min: 1                    # 通道子集大小 ∈ [1, C]，线性四档
  window_min: 50                    # 实例内时间窗 ∈ [50, L]，线性四档；50 = encoder 适用边界
  n_min: 32                         # 样本数 n ∈ [max(n_min, n_min_per_class·k), min(n_cap, N)]，对数四档
  n_min_per_class: 2                # 分层抽样每类先取 2 个（70/30 分层划分两侧各 ≥ 1）
  n_cap: 1024                       # 按预算：S1 = 1024；S2 若取 N 改此处（协议修订）
  min_samples: 32                   # 数据集级下限：N < n_lo 报错
  eval_ratio: 0.3                   # 切片内 70/30 分层（评估部分出 R'）
  # OA(16, 4^3)：(通道档, 窗长档, 样本档) = (a, b, a XOR b)，GF(4) 加法；行序按 t = 0..3 分块（块内 b = α·a XOR t）
  # → 前 4 / 8 / 12 行在三轴上各档等频；试点 8 = 前 8 行；第 17 个起循环
  design: [[0, 0, 0], [1, 2, 3], [2, 3, 1], [3, 1, 2],
           [0, 1, 1], [1, 3, 2], [2, 2, 0], [3, 0, 3],
           [0, 2, 2], [1, 0, 1], [2, 1, 3], [3, 3, 0],
           [0, 3, 3], [1, 1, 0], [2, 0, 2], [3, 2, 1]]

# --- 每任务 2L 候选（PROTOCOL §1.2） ---
candidates:
  n_shared: 20                      # 固定 seed 均匀采样，全部任务同一批（= sample_arch(use_seed=True)）
  n_random: 20                      # 每任务 rng = [random_seed, hash(task_id)]
  shared_seed: 0
  random_seed: 0

# --- 标签（PROTOCOL §1.4） ---
labels:
  best_of: checkpoints              # R' = max over 三截点 acc
  probe0_seeds: 3                   # iters=0 探针（失败地板）种子数
  floor_rule: max_majority_probe0   # floor = max(多数类占比, mean probe0)
  anchors:
    n: 2
    seeds: [1]
    rule: first_shared_aug_max_le_0.8

# --- S1 试点 ---
pilot:
  datasets: [PhonemeSpectra, HandMovementDirection, Cricket]
  n_tasks: 8

# --- S2 全语料（待拍板：方案 §8-2 源池、§8-3 L；S1 不读此块） ---
full:
  datasets: [Handwriting, UniMiB-SHAR, PhonemeSpectra, UWaveGestureLibrary,
             EthanolConcentration, Cricket, HandMovementDirection, SelfRegulationSCP2]
  n_tasks: 16

# --- 门（PROTOCOL §2） ---
gates:
  G-A1: {split_half_rho_max: 0.70, half_size: 3, n_draws: 200}
  G-A2: {real_interaction_share_min: 0.50, min_datasets_pass: 2}

# --- 成本估计（PROTOCOL §1.4；4090 锚粗拟合，5090 × 0.7） ---
cost_model:
  iter_s_intercept: 0.006
  iter_s_per_tc: 1.0e-5
  eval_s_intercept: 0.5
  eval_s_per_n: 0.004
  gpu_factor_5090: 0.7

# =====================================================================
# --- S1′ profile（PROTOCOL results/acts/s1p/PROTOCOL.md；用户 2026-09-19 拍板）---
# load_acts_config(profile="s1p") 把本块**覆盖**到上面的基线上（逐键深合并）；基线值不动，S1 仍可逐位复现。
# =====================================================================
profiles:
  s1p:
    slicing:
      n_min: 80                     # 样本数轴下限 n_lo = max(n_min, n_lo_per_class · k)
      n_lo_per_class: 7             # 机制理由：外层 5 折后折内 0.8n，官方网格条件 0.8n//k ≥ 5 ∧ 0.8n ≥ 50 ⇔ n ≥ 6.25k ∧ n ≥ 62.5
      n_min_per_class: 5            # 分层抽样每类 ≥ 5（5 折分层每折训练部分含全部类）
    eval:
      mode: cv5                     # 整切片预训练 + 分层 5 折 CV（折内官方网格），标准化在整个切片上
      n_folds: 5
      fold_seed_key: cv_folds       # run_seed_for(task_id, fold_seed_key)
    labels:
      aggregate: endpoint           # R′ = 100% iters 截点的 5 折均值（不再 best-of-3）
      shared_seeds: [0, 1]          # shared 标签 = 两种子均值；噪声估计 = 20 条 shared 全部（无偏）
      random_seeds: [0]
      probe0_seeds: 3
      anchors: none                 # 锚臂取消
    admission:
      candidates: [Handwriting, UniMiB-SHAR, PhonemeSpectra, UWaveGestureLibrary, EthanolConcentration,
                   Cricket, HandMovementDirection, SelfRegulationSCP2, SelfRegulationSCP1]
      task_rows: [1, 7]             # OA 前 8 行里 n 档 = 3 的两行 → _a01 / _a07
      min_survivors: 8              # 两种子都存活的 shared 配置数下限
      rho_min: 0.30                 # Spearman(seed0, seed1) 两任务均值门
      pool_floor: 7                 # 源池底线；不足时按 fallback 顺序启用
      fallback: [SelfRegulationSCP1]
      published_gap:                # 发表数字（acc − 多数类）只作先验记录，不作门
        HandMovementDirection: -0.067
        EthanolConcentration: 0.057
        SelfRegulationSCP2: 0.078
        SelfRegulationSCP1: 0.381
    pilot:
      datasets: [PhonemeSpectra, Cricket, UWaveGestureLibrary]
      add_if_admitted: [HandMovementDirection]
      n_tasks: 8
    ablation:
      dataset: Cricket
      arm: ablation3x
      budget_mult: 3
      fractions: [0.0833333333, 0.1666666667, 0.3333333333, 0.6666666667, 1.0]   # 前三个截点 = 1× 的 25/50/100%
      decision: {failed_drop_min: 0.15, surv_rho_max: 0.5}
    gates:
      G-A1: {split_half_rho_max: 0.70, half_size: 3, n_draws: 200}
      G-A2: {real_interaction_share_min: 0.50, min_datasets_pass_frac: 0.5}
