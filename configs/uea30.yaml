# =====================================================================
# WP10-UEA30：UEA 30 靶外 23 靶目标侧部署的唯一真源（scripts/45_uea30_deploy.py 读）
# 协议 results/uea30/PROTOCOL.md；生成于 2026-09-06（scratchpad/build_uea30_yaml.py，一次性），之后以本文件为准。
# - 尺寸 n_train / L / C / n_test / n_classes / chance：load_uea_pair(scaler="train") 实测（L = 填充长度，ragged 取
#   TRAIN∪TEST 最大；chance = TEST 多数类占比）；iters 由 N·L·C 规则（35:resolve_iters_from_size）预填，--check 断言。
# - literature：TS2Vec 论文（AAAI'22，arXiv 2106.10466 v4）Table 10，六行与 35:TABLE10 逐值对账、29 靶均值复核；
#   6 个 LODO 靶与 HAR 不在此重复（真源仍 35:TABLE10 / 39:HAR_TABLE2，单测断言不相交）。InsectWingbeat DTW 论文缺。
# - anchor_4090：单格预训练到 100% 的秒数 / 单次截点评估秒数（RTX 4090，checkpoint_results 段间差标定，PROTOCOL §0）。
# - band：A/B/D 类的预注册预测带 = 上一会话 §5.1 区间按 1.96·sqrt(p(1−p)/n_test)（p = 区间中点）放宽后裁到 [0,1]；
#   C/E 类无带（C 只报，E 走 U1）。order = 执行顺序（便宜靶先，评估重的 SAD/PenDigits/FaceDetection 最后）。
# - class：A 贴顶 / B 短序列 L<50 / C n_test≤50 / D chance-EEG / E 有净空可评 / LODO = 6 个已跑源池靶。
# =====================================================================
