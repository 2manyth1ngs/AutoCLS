# =====================================================================
# 训练量标准常量（CLAUDE.md 铁律 2；TECHNICAL_DESIGN.md 模块 3）
# 计量单位：iters = optimizer.step() 参数更新次数（非 epoch）。
# 跨任务（大小不同的切片任务）训练量必须用 iters 保证精确一致——按 epoch
# 截断时 step 数随任务大小漂移，会污染跨任务 early-val label；与 AutoCL
# 附录 B.3 的 iteration 计量一致。
#
# 换算来源（M1 实测验证配置，2026-07 口径更正）：
#   基准为 M1 验收实测 batch_size=128（HAR N=7352 → ⌈7352/128⌉=58 steps/epoch，
#   ACC 0.9372），非早期 bs=64 误算（旧值 575/4600 基于错误的 bs=64 假设）。
#   full_iters  = 40 epoch × 58 = 2320（M1 验收 / M2 full 训练量）
#   early_iters = full_iters / 8 =  290（early-validation，保持 M2 第一步
#                 验证的 1:8 比例；M2 ρ=0.85 达标结论在该比例下成立）
# =====================================================================
full_iters: 2320
early_iters: 290
batch_size: 128
lr: 1.0e-3

# --- MX-3-PQ 预算档（scripts/pq_common.py: BUDGETS；labels.yaml: pq.budgets 同值）---
# budgets 是**同一条轨迹的 checkpoint**（一次预训练跑到 290，途中在 60/120 各评估
# 一次），不是三次独立训练——成本 ≈1 次 290，却得到 3 个训练量口径的 R'。
# early_iters / full_iters 是既有的另两条口径，**原样不动**（历史缓存与已发布判定
# 全按原口径引用，铁律 2）；290 与 early_iters 数值相同纯属口径重合，不共享语义。
budgets: [60, 120, 290]
